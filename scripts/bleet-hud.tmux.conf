# 滚轮浏览回答；备用屏幕中的旧 Codex 用翻页键，普通屏幕用 tmux 历史。
set -g mouse on
set -g history-limit 50000
bind -n WheelUpPane if -F -t = '#{@bleet_hud_panel}' {} { if -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { if -F -t = '#{alternate_on}' { send-keys -t = PPage } { copy-mode -e -t = ; send-keys -X -t = -N 3 scroll-up } } }
bind -n WheelDownPane if -F -t = '#{@bleet_hud_panel}' {} { if -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { if -F -t = '#{alternate_on}' { send-keys -t = NPage } {} } }
